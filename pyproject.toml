[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lunatic-mobile-security"
dynamic = ["version"]
description = "Android security audit and official GrapheneOS installation assistant"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.3,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "cryptography>=42",
]
keywords = ["android", "security", "grapheneos", "adb", "fastboot", "pixel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5", "ruff>=0.6", "build>=1.2"]

[project.scripts]
lunatic-mobile-security = "app.main:cli"

[project.urls]
Homepage = "https://github.com/LUNATIC92I/Lunatic-IT-security-mobile"
Documentation = "https://github.com/LUNATIC92I/Lunatic-IT-security-mobile#readme"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

# The interface lives in frontend/ at the repository root (source layout) and is
# shipped inside the wheel as app/frontend, where app.config.FRONTEND_DIR finds it.
[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.core",
    "app.graphene",
    "app.models",
    "app.security",
    "app.frontend",
]
package-dir = { "app.frontend" = "frontend" }
include-package-data = false

[tool.setuptools.package-data]
"app.frontend" = ["*.html", "*.svg", "css/*.css", "js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "S603", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S108", "E501"]
